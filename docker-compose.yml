services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No ports published — backend only reachable inside the Docker network.
    # Frontend proxies browser traffic via Next.js rewrites.
    expose:
      - "3002"
    volumes:
      - sqlite-data:/app/data
      - /root/SyncNo/SyncNo:/root/SyncNo/SyncNo:ro
      - ./.env:/app/.env
      - ./VERSION:/app/VERSION:ro
    environment:
      REPO_DIR: /app
      HOST_INSTALL_DIR: ${HOST_INSTALL_DIR:-/opt/syncno}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      SYNCNO_API_KEY: ${SYNCNO_API_KEY}
      SYNCRO_API_KEY: ${SYNCRO_API_KEY}
      SYNCRO_SUBDOMAIN: ${SYNCRO_SUBDOMAIN}
    networks:
      - syncno
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:3002
      SYNCNO_API_KEY: ${SYNCNO_API_KEY}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    depends_on:
      - backend
    networks:
      - syncno
    restart: unless-stopped

volumes:
  sqlite-data:

networks:
  syncno:
    driver: bridge
    driver_opts:
      # Match docker0 MTU — ens3 path MTU is 1400 so 1500-byte container
      # packets get blackhole-dropped on TLS handshake. 1450 lets the kernel
      # fragment cleanly. Without this, node fetch to external HTTPS hangs.
      com.docker.network.driver.mtu: "1450"
