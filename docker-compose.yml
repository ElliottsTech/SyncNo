services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No ports published — backend only reachable inside the Docker network.
    # Frontend proxies browser traffic via Next.js rewrites.
    expose:
      - "3002"
    volumes:
      - sqlite-data:/app/data
      - /root/SyncNo/SyncNo:/root/SyncNo/SyncNo:ro
      - ./.env:/app/.env:ro
      - ./VERSION:/app/VERSION:ro
    environment:
      REPO_DIR: /app
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      SYNCNO_API_KEY: ${SYNCNO_API_KEY}
      SYNCRO_API_KEY: ${SYNCRO_API_KEY}
      SYNCRO_SUBDOMAIN: ${SYNCRO_SUBDOMAIN}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:3002
      SYNCNO_API_KEY: ${SYNCNO_API_KEY}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
